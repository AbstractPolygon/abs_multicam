name: Release

# Push a tag like v0.2.0 to build Windows, macOS and Linux installers and publish them as a GitHub release.
# "Run workflow" (manual) builds everything and keeps the files as workflow artifacts without publishing a release.
#
# Optional signing: add these repository secrets and the builds are signed automatically (otherwise unsigned).
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD   Windows code-signing certificate (.pfx, base64 or URL) and its password
#   CSC_LINK, CSC_KEY_PASSWORD           macOS "Developer ID Application" certificate (.p12, base64 or URL) and password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   macOS notarization (only used when CSC_LINK is also set)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows,     os: windows-latest,  flag: --win }
          - { name: macOS-arm64, os: macos-latest,    flag: --mac --arm64 }    # Apple silicon
          - { name: macOS-x64,   os: macos-15-intel,  flag: --mac --x64 }      # Intel (ffmpeg is bundled per chip, so one job each)
          - { name: Linux,       os: ubuntu-latest,   flag: --linux }
          - { name: Linux-arm64, os: ubuntu-24.04-arm, flag: --linux --arm64 }   # Raspberry Pi (64-bit Raspberry Pi OS)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi

      - run: npm ci

      - name: Movement detector tests
        run: node scripts/test-motion.js

      - name: Build installers
        run: npx electron-builder ${{ matrix.flag }} ${{ secrets.CSC_LINK && secrets.APPLE_ID && startsWith(matrix.os, 'macos') && '-c.mac.notarize=true' || '' }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'      # only sign when a certificate is provided below
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # latest.yml / latest-linux.yml and the .blockmap files are what the in-app updater reads on Windows and Linux.
      - uses: actions/upload-artifact@v4
        with:
          name: ABS_MultiCam-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.AppImage.blockmap
            dist/*.deb
            dist/latest.yml
            dist/latest-linux.yml
            dist/latest-linux-arm64.yml

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List files
        run: ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
